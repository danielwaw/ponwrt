
name: Build PONWrt AdGuardHome LuCI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-ply \
            python3-docutils python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            subversion swig time patch perl \
            autoconf automake autopoint libtool \
            pkgconf cmake ninja-build ccache \
            libgmp-dev libmpc-dev libmpfr-dev \
            texinfo xz-utils zstd bzip2 cpio \
            device-tree-compiler jq

      - name: Checkout PONWrt
        run: |
          git clone https://github.com/pbs05/ponwrt.git ponwrt
          cd ponwrt
          git checkout c3b518baec
          git log -1 --oneline

      - name: Update standard feeds
        run: |
          cd ponwrt

          # Remove custom adguardhome feed if present
          sed -i '/^src-git adguardhome /d' feeds.conf.default

          ./scripts/feeds update -a

          # Install feed packages into build tree
          ./scripts/feeds install -a

      - name: Add AdGuardHome LuCI package
        run: |
          cd ponwrt

          git clone --depth=1 \
            https://github.com/kenzok78/luci-app-adguardhome.git \
            package/luci-app-adguardhome

          test -f package/luci-app-adguardhome/Makefile

          echo "Package Makefile:"
          grep -E \
            'PKG_NAME|PKG_VERSION|PKG_RELEASE|LUCI_DEPENDS' \
            package/luci-app-adguardhome/Makefile

      
      - name: Configure PONWrt
        run: |
          cd ponwrt

          # Find actual Nokia XG-040G-MD UBI profile
          echo "===== Nokia device profiles ====="
          grep -R -n -i 'xg-040g-md' \
            target/linux/airoha/image/ || true

          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_luci-app-adguardhome=m
          # CONFIG_PACKAGE_luci-app-adguardhome_INCLUDE_binary is not set
          # CONFIG_PACKAGE_adguardhome is not set
          # CONFIG_GOLANG_BUILD_BOOTSTRAP is not set
          EOF

          make defconfig

          echo "===== Selected target ====="
          grep -E '^CONFIG_TARGET_airoha.*=y$' .config || true

          echo "===== APK and LuCI package ====="
          grep -E \
            '^CONFIG_USE_APK=|^CONFIG_PACKAGE_luci-app-adguardhome=|^CONFIG_GOLANG_BUILD_BOOTSTRAP=' \
            .config || true

          # Verify correct target architecture
          grep -q '^CONFIG_TARGET_airoha_an7581=y$' .config

          # Verify APK package format
          grep -q '^CONFIG_USE_APK=y$' .config

          # Verify LuCI package selected
          grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=m$' .config

          # Ensure AdGuardHome core is not enabled
          if grep -q \
            '^CONFIG_PACKAGE_luci-app-adguardhome_INCLUDE_binary=y$' \
            .config; then
            echo "ERROR: AdGuardHome binary dependency enabled"
            exit 1
          fi

          echo "Configuration verified successfully"


      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-downloads-an7581-v2
          restore-keys: |
            ponwrt-downloads-an7581-

      - name: Download sources
        run: |
          cd ponwrt
          make download -j2

      - name: Build LuCI APK
        run: |
          cd ponwrt
          set -o pipefail

          make package/luci-app-adguardhome/compile \
            -j2 V=s 2>&1 | tee ../build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p upload

          find ponwrt/bin/packages \
            -type f \
            -name 'luci-app-adguardhome*.apk' \
            -exec cp -v {} upload/ \;

          ls -lh upload/

          test -n "$(find upload -name '*.apk' -print -quit)"

          sha256sum upload/*.apk > upload/SHA256SUMS

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ponwrt-apk
          path: upload/
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            ponwrt/logs/
          if-no-files-found: ignore
          retention-days: 7
