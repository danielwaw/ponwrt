name: Build PONWrt LuCI AdGuardHome APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luci-adguardhome-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      REPO_URL: https://github.com/pbs05/ponwrt.git
      REPO_COMMIT: c3b518baec
      LUCI_REPO: https://github.com/kenzok78/luci-app-adguardhome.git
      TZ: Asia/Shanghai

    steps:
      - name: Install build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools python3-ply \
            rsync unzip file wget curl subversion swig time patch perl \
            autoconf automake autopoint libtool pkg-config cmake ninja-build \
            g++-multilib gcc-multilib libgmp-dev libmpc-dev libmpfr-dev \
            texinfo xz-utils zstd bzip2 cpio jq ca-certificates

      - name: Clone matching PONWrt source
        run: |
          git clone --filter=blob:none "$REPO_URL" openwrt
          cd openwrt
          git checkout "$REPO_COMMIT"
          echo "PONWrt: $(git rev-parse HEAD)"
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Update standard feeds
        run: |
          cd "$OPENWRT_PATH"
          # This project is a single package, not a standalone feed.
          sed -i '/^src-git adguardhome /d' feeds.conf.default
          ./scripts/feeds update -a
          # Register feed package definitions; this does not compile them.
          ./scripts/feeds install -a

      - name: Add LuCI package as local package
        run: |
          cd "$OPENWRT_PATH"
          git clone --depth=1 "$LUCI_REPO" package/luci-app-adguardhome
          test -f package/luci-app-adguardhome/Makefile
          grep -nE '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|LUCI_DEPENDS|LUCI_PKGARCH)' \
            package/luci-app-adguardhome/Makefile
          # Ensure this is the UI-only variant of the source package.
          grep -q 'PACKAGE_$(PKG_NAME)_INCLUDE_binary:adguardhome' \
            package/luci-app-adguardhome/Makefile

      - name: Configure only the LuCI package
        run: |
          cd "$OPENWRT_PATH"
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_luci-app-adguardhome=m
          # CONFIG_PACKAGE_luci-app-adguardhome_INCLUDE_binary is not set
          # CONFIG_PACKAGE_adguardhome is not set
          EOF
          make defconfig

          echo '===== Effective configuration ====='
          grep -E '^(CONFIG_TARGET_airoha=y|CONFIG_TARGET_airoha_an7581=y|CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y|CONFIG_USE_APK=y|CONFIG_PACKAGE_luci-app-adguardhome=m)$' .config || true
          grep -q '^CONFIG_TARGET_airoha_an7581=y$' .config
          grep -q '^CONFIG_USE_APK=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=m$' .config
          if grep -q '^CONFIG_PACKAGE_luci-app-adguardhome_INCLUDE_binary=y$' .config; then
            echo 'ERROR: AdGuardHome core dependency enabled'
            exit 1
          fi

      - name: Cache downloaded files
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-luci-dl-${{ runner.os }}-v1
          restore-keys: |
            ponwrt-luci-dl-${{ runner.os }}-

      - name: Build only luci-app-adguardhome APK
        run: |
          cd "$OPENWRT_PATH"
          set -o pipefail
          # No global 'make download' and no full-firmware 'make'.
          make -j2 package/luci-app-adguardhome/compile V=s \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect only the requested APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$OPENWRT_PATH/bin/packages" -type f \
            -name 'luci-app-adguardhome_*.apk' \
            -exec cp -v '{}' "$GITHUB_WORKSPACE/output/" \;
          test -n "$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -name '*.apk' -print -quit)"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum ./*.apk > SHA256SUMS
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ponwrt-apk
          path: output/
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luci-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
