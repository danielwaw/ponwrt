name: Build PONWrt AdGuardHome LuCI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    defaults:
      run:
        shell: bash

    env:
      REPO_URL: https://github.com/pbs05/ponwrt.git
      REPO_COMMIT: c3b518baec
      LUCI_REPO: https://github.com/kenzok78/luci-app-adguardhome.git
      DEBIAN_FRONTEND: noninteractive

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext \
            git curl wget file rsync unzip zstd \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools \
            python3-ply subversion swig time patch perl \
            autoconf automake autopoint libtool pkg-config \
            cmake ninja-build gcc-multilib g++-multilib \
            libgmp-dev libmpc-dev libmpfr-dev texinfo \
            xz-utils bzip2 cpio jq ca-certificates

      - name: Clone PONWrt
        run: |
          git clone --filter=blob:none "$REPO_URL" openwrt

          cd openwrt
          git checkout "$REPO_COMMIT"

          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Update feeds
        run: |
          cd "$OPENWRT_PATH"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add AdGuardHome LuCI
        run: |
          cd "$OPENWRT_PATH"

          # 避免同名软件包冲突
          if [ -e package/feeds/luci/luci-app-adguardhome ]; then
            rm package/feeds/luci/luci-app-adguardhome
          fi

          git clone --depth=1 \
            "$LUCI_REPO" \
            package/luci-app-adguardhome

          test -f package/luci-app-adguardhome/Makefile

      - name: Fix LuCI dependency
        run: |
          cd "$OPENWRT_PATH"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("package/luci-app-adguardhome/Makefile")
          text = p.read_text()

          old = "+PACKAGE_$(PKG_NAME)_INCLUDE_binary:adguardhome"

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: Unexpected AdGuardHome dependency"
              )

          text = text.replace(old, "", 1)

          p.write_text(text)

          print("===== Updated dependencies =====")

          for line in text.splitlines():
              if line.startswith("LUCI_DEPENDS"):
                  print(line)

          if old in p.read_text():
              raise SystemExit("Dependency removal failed")
          PY

          # 删除旧的软件包元数据
          rm -rf tmp/info
          rm -f tmp/.packageinfo*
          rm -f tmp/.packagedeps*
          rm -f tmp/.packageauxvars*
          rm -f tmp/.config-package.in

      - name: Configure target
        run: |
          cd "$OPENWRT_PATH"

          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_luci-app-adguardhome=m
          # CONFIG_PACKAGE_luci-app-adguardhome_INCLUDE_binary is not set
          # CONFIG_PACKAGE_adguardhome is not set
          # CONFIG_GOLANG_BUILD_BOOTSTRAP is not set
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_airoha_an7581=y$' .config
          grep -q '^CONFIG_USE_APK=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=m$' .config

          echo "===== Package configuration ====="

          grep -E \
            '^CONFIG_TARGET_airoha.*=y$|^CONFIG_USE_APK=|^CONFIG_PACKAGE_luci-app-adguardhome=' \
            .config

      - name: Check package definitions
        run: |
          cd "$OPENWRT_PATH"

          echo "===== Relevant package definitions ====="

          grep -R -n \
            'Package: luci-app-adguardhome' \
            tmp/.packageinfo* 2>/dev/null || true

          echo "===== Dependency declarations ====="

          grep -R -n \
            'adguardhome.*DEPENDS\|LUCI_DEPENDS' \
            package/luci-app-adguardhome/Makefile \
            2>/dev/null || true

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-adguardhome-dl-v3
          restore-keys: |
            ponwrt-adguardhome-dl-

      - name: Build host tools
        run: |
          cd "$OPENWRT_PATH"

          set -o pipefail

          make -j2 tools/install V=s \
            2>&1 | tee "$GITHUB_WORKSPACE/tools.log"

      - name: Build toolchain
        run: |
          cd "$OPENWRT_PATH"

          set -o pipefail

          make -j2 toolchain/install V=s \
            2>&1 | tee "$GITHUB_WORKSPACE/toolchain.log"

      - name: Compile LuCI APK
        run: |
          cd "$OPENWRT_PATH"

          set -o pipefail

          make -j2 \
            package/luci-app-adguardhome/compile \
            V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          echo "===== Generated packages ====="

          find "$OPENWRT_PATH/bin" \
            -type f \
            -iname '*adguardhome*.apk' \
            -print

          find "$OPENWRT_PATH/bin" \
            -type f \
            -name 'luci-app-adguardhome-*.apk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;

          test -n "$(
            find "$GITHUB_WORKSPACE/output" \
              -name '*.apk' -print -quit
          )"

      - name: Verify APK dependencies
        run: |
          cd "$OPENWRT_PATH"

          APK_TOOL="staging_dir/host/bin/apk"

          if [ ! -x "$APK_TOOL" ]; then
            APK_TOOL="staging_dir/hostpkg/bin/apk"
          fi

          test -x "$APK_TOOL"

          for pkg in "$GITHUB_WORKSPACE"/output/*.apk; do

            echo "===== Inspecting $pkg ====="

            "$APK_TOOL" adbdump "$pkg" \
              > "$GITHUB_WORKSPACE/apk-metadata.txt"

            if grep -Eq \
              '^[[:space:]]*-[[:space:]]+adguardhome([<>=[:space:]]|$)' \
              "$GITHUB_WORKSPACE/apk-metadata.txt"; then

              echo "ERROR: APK still depends on AdGuardHome core"
              exit 1
            fi

          done

          echo "Dependency verification passed"

      - name: Generate checksums
        run: |
          cd "$GITHUB_WORKSPACE/output"

          sha256sum ./*.apk > SHA256SUMS

          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-ponwrt-apk
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            tools.log
            toolchain.log
            build.log
            apk-metadata.txt
          retention-days: 7
          if-no-files-found: ignore
