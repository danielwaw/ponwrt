name: Build PonWrt for XG-040G-MD

on:
  workflow_dispatch:

# 赋予自动发布 Release 等操作所需的写入权限
permissions:
  contents: write

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  # 开启缓存功能
  CACHE_TOOLCHAIN: true

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v5
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"

      - name: Clone PonWrt Source Code
        run: |
          git clone --depth=1 -b $REPO_BRANCH$REPO_URL openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo "DATE=$(date +'\%Y\%m\%d')" >> $GITHUB_ENV
          echo "RELEASE_TAG=PonWrt-XG-040G-MD-$(date +'\%Y\%m\%d\%H\%M')" >> $GITHUB_ENV

      - name: Cache Toolchain & ccache
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: true
          mixkey: ponwrt-${{ env.REPO_BRANCH }}-airoha-an7581
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Install Feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load XG-040G-MD Configuration
        run: |
          cd $OPENWRT_PATH
          
          # 使用 PonWrt 作者提供的 AN7581 基础配置
          cp configs/an7581.config .config
          
          # 锁定设备为 XG-040G-MD
          echo "CONFIG_TARGET_airoha=y" >> .config
          echo "CONFIG_TARGET_airoha_an7581=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y" >> .config
          
          # 开启 ccache 支持 (配合上面的缓存插件)
          echo "CONFIG_CCACHE=y" >> .config
          
          make defconfig

      - name: Download DL Packages
        run: |
          cd $OPENWRT_PATH
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          cd $OPENWRT_PATH
          THREADS="$(nproc)"
          echo "开始编译 (线程数: $THREADS)..."
          
          if make -j"$THREADS"; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "多线程编译失败，开始单线程详细日志编译..."
            make -j1 V=s
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload Firmware to Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: |
            ${{ env.OPENWRT_PATH }}/bin/targets/airoha/an7581/*
          retention-days: 7

      - name: Create Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.RELEASE_TAG }}
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.OPENWRT_PATH }}/bin/targets/airoha/an7581/*
          allowUpdates: true
          replacesArtifacts: true
          body: |
            # PonWrt for Nokia XG-040G-MD
            - 💻 源码分支：`${{ env.REPO_BRANCH }}`
            - 🛠️ 包含特性：AN7581 底层驱动 + PON 支持
            - ⚙️ 已开启 Ccache 编译缓存加速
